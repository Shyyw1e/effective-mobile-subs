version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - APP_PORT=8080
      - LOG_LEVEL=debug
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=Shyywie_8169
      - DB_NAME=effectivesubs
    volumes:
      - .env:/root/.env
    restart: always

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: effectivesubs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shyywie_8169
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
